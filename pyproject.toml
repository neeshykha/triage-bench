[project]
name = "triage-bench"
version = "0.1.0"
description = "Tier 1 support triage with an adversarial QA agent, and the eval harness that measures whether the second agent earns its cost."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.1",
    "pydantic>=2.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
